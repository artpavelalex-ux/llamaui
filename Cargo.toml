[package]
name = "lama-chat"
version = "0.1.0"
edition = "2024"

[lib]
name = "lama_chat"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# --- tauri core ---
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
scraper = "0.20"
regex = "1"
dirs = "5"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
